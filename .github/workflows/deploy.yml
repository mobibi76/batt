name: Test and deploy web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Build and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select verification scope since last successful deployment
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-scope.mjs
      - run: npm ci
      - run: node --test scripts/ci-scope.test.mjs
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: verified-build-input
          path: dist
          retention-days: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  browser-checks:
    name: Browser checks (${{ needs.build.outputs.scope }}, ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-build-input
          path: dist
      - name: Use runner Chrome or install if missing
        timeout-minutes: 3
        run: |
          if [ -x /opt/google/chrome/chrome ]; then
            /opt/google/chrome/chrome --version
          else
            npx playwright install --with-deps chrome
          fi
      - name: Check title and access screens
        if: needs.build.outputs.scope == 'hero'
        run: |
          npm run test:e2e -- tests/title-art.spec.ts --workers=2
          npm run test:e2e -- tests/design.spec.ts --grep 'login hero' --workers=1
      - name: Check full workflows (parallel shards)
        if: needs.build.outputs.scope != 'hero'
        run: npm run test:e2e -- tests/control-labels.spec.ts tests/design.spec.ts tests/console.spec.ts tests/manual.spec.ts tests/ux-decisions.spec.ts tests/operational-twin.spec.ts tests/file-picker.spec.ts tests/demo-process.spec.ts tests/title-art.spec.ts tests/role-usability.spec.ts tests/role-continuity.spec.ts tests/approvals.spec.ts tests/private-demo.spec.ts --workers=2 --shard=${{ matrix.shard }}/2
      - name: Keep failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.shard }}
          path: test-results
          retention-days: 7
  deploy:
    name: Publish verified site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, browser-checks]
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
